# Curriculum v2 — composite SFT loss (md Section 1) + existing 10-stage flow.
#
# Differences vs curriculum_v1.yaml:
#   - `loss:` block adds w_ans / w_gate / lam_view / lam_iou (+ lam_klal=0).
#   - Driven by qwen-vl-finetune/scripts/run_curriculum_v2.sh, which calls
#     train_nuscenes_qwen3vl_v2.py (CompositeWSDTrainer.compute_loss).
#   - No grounding-warmup stage 0 (deferred to a follow-up PR per the
#     loss-only scope decided in the AskUserQuestion).
#
# To run:
#   python -m nuscenes_pipeline.postprocessing.build_eval_subset --n_per_cat 200
#   bash qwen-vl-finetune/scripts/run_curriculum_v2.sh \
#       qwen-vl-finetune/configs/curriculum_v2.yaml
#
# Phased rollout via per-stage `loss:` overrides:
#   - Phase A (md §9 step 2): set w_ans / w_gate > 0; keep lam_view = lam_iou = 0.
#   - Phase B (step 3):       add lam_view > 0.
#   - Phase C (step 4):       add lam_iou > 0.
# Re-validate per-category eval after each phase.

output_root: output/curriculum_v2_0609
base_model: ckpts/qwen3_vl_8b_instruct
train_data_dir: sft_dataset
eval_subset_dir: sft_dataset/eval_subset_200
eval_categories: [OBS, IDN, AAS, SRO, TSS, RML, DRA, RWP, ESC, CHR]

defaults:
  epochs: 1
  peak_lr: 2.0e-4
  wsd: [0.10, 0.70, 0.20]
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  eval_steps: 500
  save_steps: 500
  save_total_limit: 2
  weight_decay: 0.01
  max_grad_norm: 1.0
  model_max_length: 16384
  max_pixels: 1440208
  min_pixels: 784
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  lora_target_modules: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
  gradient_checkpointing: true
  dataloader_num_workers: 4
  bf16: true
  report_to: tensorboard
  full_val_for_stage_end_eval: false
  max_assistant_tokens: 6000

# v2 composite-loss defaults. Per-stage overrides go under `stages[i].loss`.
loss:
  w_ans: 2.0
  w_gate: 1.5
  lam_view: 0.5
  lam_iou: 0.5
  lam_klal: 0.0           # KLAL execution disabled in this PR (FA stays on)
  klal_layers: "-1"
  iou_alpha: 1.0
  view_class_weight: auto # inverse-frequency from train image_idx histogram

# Sequential curriculum: easy perceptual -> hard reasoning.
stages:
  - { name: OBS }
  - { name: IDN }
  - { name: AAS }
  - { name: SRO }
  - { name: TSS }
  - { name: RML }
  - { name: DRA }
  - { name: RWP }
  - { name: ESC }
  - { name: CHR }
